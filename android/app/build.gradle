apply plugin: 'com.android.application'

android {
    namespace "com.walkingfish.easyaccounting"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.walkingfish.easyaccounting"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21809
        versionName "2.1.8.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Split APK / ABI 配置（直接分發 APK 時依架構拆分，減少下載體積；執行 bundle 時自動關閉以防止 AAB 構建衝突）
    splits {
        abi {
            def isRunningBundle = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }
            enable !isRunningBundle
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }
    signingConfigs {
        release {
            // 優先讀取 keystore.properties (支援專案根目錄、android/ 目錄或 app/ 目錄)
            def candidatePropFiles = [
                rootProject.file("keystore.properties"),
                rootProject.file("../keystore.properties"),
                file("keystore.properties")
            ]
            def keystorePropsFile = candidatePropFiles.find { it.exists() }
            if (keystorePropsFile) {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                def storeFilePath = props.getProperty('storeFile')
                if (storeFilePath) {
                    def resolvedFile = file(storeFilePath).isAbsolute() ? file(storeFilePath) :
                        keystorePropsFile.parentFile ? new File(keystorePropsFile.parentFile, storeFilePath) : file(storeFilePath)
                    storeFile resolvedFile
                }
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            } else if (System.getenv("KEYSTORE") != null && file(System.getenv("KEYSTORE")).exists()) {
                storeFile file(System.getenv("KEYSTORE"))
                storePassword System.getenv("STOREPASS") ?: System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEYALIAS") ?: System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYPASS") ?: System.getenv("KEY_PASSWORD")
            } else if (System.getenv("ANDROID_KEYSTORE_FILE") != null && file(System.getenv("ANDROID_KEYSTORE_FILE")).exists()) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (rootProject.file("../release.keystore").exists()) {
                storeFile rootProject.file("../release.keystore")
                storePassword System.getenv("STOREPASS") ?: System.getenv("KEYSTORE_PASSWORD") ?: "android123"
                keyAlias System.getenv("KEYALIAS") ?: System.getenv("KEY_ALIAS") ?: "easyaccounting"
                keyPassword System.getenv("KEYPASS") ?: System.getenv("KEY_PASSWORD") ?: "android123"
            } else if (rootProject.file("release.keystore").exists()) {
                storeFile rootProject.file("release.keystore")
                storePassword System.getenv("STOREPASS") ?: System.getenv("KEYSTORE_PASSWORD") ?: "android123"
                keyAlias System.getenv("KEYALIAS") ?: System.getenv("KEY_ALIAS") ?: "easyaccounting"
                keyPassword System.getenv("KEYPASS") ?: System.getenv("KEY_PASSWORD") ?: "android123"
            } else if (file("release.keystore").exists()) {
                storeFile file("release.keystore")
                storePassword System.getenv("STOREPASS") ?: System.getenv("KEYSTORE_PASSWORD") ?: "android123"
                keyAlias System.getenv("KEYALIAS") ?: System.getenv("KEY_ALIAS") ?: "easyaccounting"
                keyPassword System.getenv("KEYPASS") ?: System.getenv("KEY_PASSWORD") ?: "android123"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force "androidx.browser:browser:$androidxBrowserVersion"
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'androidx.browser' && details.requested.name == 'browser') {
                details.useVersion '1.8.0'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
