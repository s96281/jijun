name: Build and Release (Web & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v2.1.8.5，若為空則自動讀取 package.json 的版本)'
        required: false
        default: ''
      prerelease:
        description: '標記為發布預覽版 (Pre-release)'
        type: boolean
        default: false
      allow_ephemeral_keystore:
        description: '允許使用臨時動態金鑰（僅限測試 fork 構建，不可用於正式發布，否則無法覆蓋更新）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 Build Web Assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_SYNC_SERVER_URL: ${{ secrets.VITE_SYNC_SERVER_URL }}

      - name: Package Web Release (Zip)
        run: |
          cd dist
          zip -r ../easy-accounting-web.zip .
          cd ..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: easy-accounting-web.zip
          retention-days: 7

  build-android:
    name: 📱 Build Android (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App for Android Sync
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_SYNC_SERVER_URL: ${{ secrets.VITE_SYNC_SERVER_URL }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Prepare Signing Keystore
        id: prepare_keystore
        run: |
          mkdir -p release-artifacts
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::notice::使用 GitHub Repository Secrets 中的正式簽名 Keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE=$PWD/release.keystore" >> $GITHUB_ENV
            echo "STOREPASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYPASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "release.keystore" ]; then
            echo "::notice::使用專案根目錄中已存在的固定 release.keystore..."
            echo "KEYSTORE=$PWD/release.keystore" >> $GITHUB_ENV
            echo "STOREPASS=${{ secrets.KEYSTORE_PASSWORD || 'android123' }}" >> $GITHUB_ENV
            echo "KEYALIAS=${{ secrets.KEY_ALIAS || 'easyaccounting' }}" >> $GITHUB_ENV
            echo "KEYPASS=${{ secrets.KEY_PASSWORD || 'android123' }}" >> $GITHUB_ENV
          elif [ -f "android/app/release.keystore" ]; then
            echo "::notice::使用 android/app/release.keystore..."
            echo "KEYSTORE=$PWD/android/app/release.keystore" >> $GITHUB_ENV
            echo "STOREPASS=${{ secrets.KEYSTORE_PASSWORD || 'android123' }}" >> $GITHUB_ENV
            echo "KEYALIAS=${{ secrets.KEY_ALIAS || 'easyaccounting' }}" >> $GITHUB_ENV
            echo "KEYPASS=${{ secrets.KEY_PASSWORD || 'android123' }}" >> $GITHUB_ENV
          elif [ "${{ secrets.ALLOW_EPHEMERAL_KEYSTORE }}" = "true" ] || [ "${{ github.event.inputs.allow_ephemeral_keystore }}" = "true" ]; then
            echo "::warning::[警告] 未偵測到固定金鑰，依設定允許生成臨時動態金鑰！此產出之 APK 無法用於舊版本覆蓋更新！"
            keytool -genkey -v -keystore release.keystore -alias easyaccounting -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=EasyAccounting, O=WalkingFish, C=TW"
            echo "KEYSTORE=$PWD/release.keystore" >> $GITHUB_ENV
            echo "STOREPASS=android123" >> $GITHUB_ENV
            echo "KEYALIAS=easyaccounting" >> $GITHUB_ENV
            echo "KEYPASS=android123" >> $GITHUB_ENV
          else
            echo "::error::=========================================================================="
            echo "::error::[簽名安全防護阻擋] 未配置固定的 Android 簽名金鑰 (Secret 或 release.keystore)！"
            echo "::error::為防止動態生成隨機金鑰導致使用者安裝新版本時簽名不符（無法覆蓋更新並遺失記帳資料），CI 已安全終止。"
            echo "::error::請至 GitHub Repo -> Settings -> Secrets and variables -> Actions 設定："
            echo "::error::  1. ANDROID_KEYSTORE_BASE64"
            echo "::error::  2. KEYSTORE_PASSWORD"
            echo "::error::  3. KEY_ALIAS"
            echo "::error::  4. KEY_PASSWORD"
            echo "::error::您可於本機執行 'npm run keystore:generate' 產生正式金鑰並取得 Base64。"
            echo "::error::=========================================================================="
            exit 1
          fi

      - name: Build Android APKs (Release)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon
          cd ..

      - name: Build Android Bundle (AAB Release)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace --no-daemon
          cd ..

      - name: Upload Gradle Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/**/build/reports/

      - name: Sign APKs & AAB
        run: |
          # 尋找最新版本的 apksigner 工具
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          mkdir -p release-artifacts

          # 簽署與重命名所有 Release APKs
          for apk in $(find android/app/build/outputs/apk/release -name "*.apk"); do
            raw_filename=$(basename "$apk")
            filename=$(echo "$raw_filename" | sed 's/-unsigned//g')
            echo "Processing APK: $raw_filename -> $filename"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEYALIAS" --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" --out "release-artifacts/easy-accounting-$filename" "$apk"
            echo "=== 簽名驗證與憑證指紋 ($filename) ==="
            "$APKSIGNER" verify --verbose --print-certs "release-artifacts/easy-accounting-$filename"
          done

          # 簽署與重命名 AAB (若有)
          for aab in $(find android/app/build/outputs/bundle/release -name "*.aab"); do
            raw_filename=$(basename "$aab")
            filename=$(echo "$raw_filename" | sed 's/-unsigned//g')
            echo "Processing AAB: $raw_filename -> $filename"
            cp "$aab" "release-artifacts/easy-accounting-$filename"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEYSTORE" -storepass "$STOREPASS" -keypass "$KEYPASS" "release-artifacts/easy-accounting-$filename" "$KEYALIAS"
          done

          ls -la release-artifacts

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*
          retention-days: 7

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "FINAL_TAG=$TAG" >> $GITHUB_ENV
          echo "Selected Tag: $TAG"

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: dist-release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist-release

      - name: Generate Checksums & Release Notes
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          cat << 'EOF' > RELEASE_BODY.md
          ## 輕鬆記帳 Release

          本版本包含 **Web 靜態網頁打包檔** 與 **Android 安裝檔 (APK / AAB)**：

          ### 📦 檔案清單說明
          - **`easy-accounting-web.zip`**: 完整前端靜態資源打包，解壓縮後即可在任何伺服器部署或作為 PWA 離線使用。
          - **`easy-accounting-app-universal-release.apk`**: 通用架構 Android 安裝包（支援所有手機架構，推薦首選）。
          - **`easy-accounting-app-arm64-v8a-release.apk`**: 針對 64 位元 ARM 處理器最佳化（體積更小）。
          - **`easy-accounting-app-armeabi-v7a-release.apk`**: 針對 32 位元 ARM 處理器最佳化。
          - **`easy-accounting-app-release.aab`**: Google Play 發布套件 (Android App Bundle)。
          - **`SHA256SUMS.txt`**: 各發布檔案之 SHA-256 校驗碼。

          ---
          *自動化構建由 GitHub Actions 產生*
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FINAL_TAG }}
          name: 輕鬆記帳 ${{ env.FINAL_TAG }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
